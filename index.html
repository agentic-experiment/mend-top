<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mend-top</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Georgia', serif;
            cursor: crosshair;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .title {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.12);
            font-size: 14px;
            letter-spacing: 12px;
            text-transform: uppercase;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="title">mend-top</div>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let W, H;
        let mouse = { x: -1000, y: -1000 };
        let time = 0;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        document.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        const N = 120;
        const threads = [];
        const palette = [
            [255, 180, 130],
            [200, 160, 255],
            [140, 220, 255],
            [255, 220, 160],
            [180, 255, 200],
        ];

        for (let i = 0; i < N; i++) {
            const angle = (Math.PI * 2 * i) / N + (Math.random() - 0.5) * 0.1;
            const r = 60 + Math.random() * 220;
            threads.push({
                angle: angle,
                radius: r,
                baseRadius: r,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.3 + Math.random() * 0.7,
                wobbleAmp: 8 + Math.random() * 25,
                color: palette[i % palette.length],
                thickness: 0.3 + Math.random() * 0.7,
                phase: Math.random() * Math.PI * 2,
                mend: Math.random(),
            });
        }

        function draw() {
            time += 0.008;
            ctx.fillStyle = 'rgba(10, 10, 15, 0.08)';
            ctx.fillRect(0, 0, W, H);

            const cx = W / 2;
            const cy = H / 2;

            for (let i = 0; i < N; i++) {
                const t = threads[i];
                const breathe = Math.sin(time * 0.5 + t.phase) * 20;
                const dx = mouse.x - cx;
                const dy = mouse.y - cy;
                const distToMouse = Math.sqrt(dx * dx + dy * dy);
                const pull = Math.max(0, 1 - distToMouse / 300) * 30;
                const currentR = t.baseRadius + breathe + pull;
                const r = currentR + Math.sin(time * t.wobbleSpeed + t.wobble) * t.wobbleAmp;
                const x = cx + Math.cos(t.angle + time * 0.1) * r;
                const y = cy + Math.sin(t.angle + time * 0.1) * r;

                t.mend += (1 - t.mend) * 0.01;

                const next = threads[(i + 1) % N];
                const nR = next.baseRadius + Math.sin(time * 0.5 + next.phase) * 20
                    + Math.sin(time * next.wobbleSpeed + next.wobble) * next.wobbleAmp;
                const nx = cx + Math.cos(next.angle + time * 0.1) * nR;
                const ny = cy + Math.sin(next.angle + time * 0.1) * nR;

                const edgeDist = Math.sqrt((x - nx) ** 2 + (y - ny) ** 2);
                const alpha = Math.min(1, edgeDist / 80) * 0.6 * t.mend;

                const c = t.color;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(t.angle + time * 0.1) * (r * 0.1),
                          cy + Math.sin(t.angle + time * 0.1) * (r * 0.1));
                ctx.lineTo(x, y);
                ctx.lineTo(nx, ny);
                ctx.strokeStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})`;
                ctx.lineWidth = t.thickness;
                ctx.stroke();

                if (distToMouse < 200) {
                    const glow = (1 - distToMouse / 200) * 0.8;
                    ctx.beginPath();
                    ctx.arc(x, y, 2 + glow * 4, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${glow * 0.5})`;
                    ctx.fill();
                }
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
